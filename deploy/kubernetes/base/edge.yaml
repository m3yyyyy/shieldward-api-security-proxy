apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldward-edge
  namespace: shieldward
  labels:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shieldward
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shieldward
        app.kubernetes.io/component: edge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: ghcr.io/m3yyyyy/shieldward-api-security-proxy/edge:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8787"
            - name: CONTROL_PLANE_URL
              value: https://shieldward-control-plane.shieldward.svc.cluster.local:18080
            - name: SHIELDWARD_PUBLIC_KEY_FILE
              value: /run/secrets/shieldward/control-plane-public.pem
            - name: SHIELDWARD_TLS_CERT_FILE
              value: /run/secrets/shieldward/tls-cert.pem
            - name: SHIELDWARD_TLS_KEY_FILE
              value: /run/secrets/shieldward/tls-key.pem
            - name: NODE_EXTRA_CA_CERTS
              value: /run/secrets/shieldward/control-plane-ca.pem
            - name: SHIELDWARD_HEALTHCHECK_URL
              value: https://127.0.0.1:8787/readyz
          ports:
            - name: https
              containerPort: 8787
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/shieldward
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: shieldward-edge-credentials
            defaultMode: 0440
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shieldward-edge
  namespace: shieldward
  labels:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: edge
  ports:
    - name: https
      port: 8787
      targetPort: https
      protocol: TCP
