apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldward-control-plane
  namespace: shieldward
  labels:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shieldward
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shieldward
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/m3yyyyy/shieldward-api-security-proxy/control-plane:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - -policy
            - /etc/shieldward/policy.yaml
            - -private-key
            - /run/secrets/shieldward/signing-key.pem
            - -listen
            - 0.0.0.0:18080
            - -tls-cert
            - /run/secrets/shieldward/tls-cert.pem
            - -tls-key
            - /run/secrets/shieldward/tls-key.pem
          env:
            - name: SHIELDWARD_HEALTHCHECK_URL
              value: https://127.0.0.1:18080/readyz
            - name: SHIELDWARD_HEALTHCHECK_CA_FILE
              value: /run/secrets/shieldward/tls-ca.pem
          ports:
            - name: https
              containerPort: 18080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policy
              mountPath: /etc/shieldward
              readOnly: true
            - name: credentials
              mountPath: /run/secrets/shieldward
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: shieldward-policy
        - name: credentials
          secret:
            secretName: shieldward-control-plane-credentials
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: shieldward-control-plane
  namespace: shieldward
  labels:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shieldward
    app.kubernetes.io/component: control-plane
  ports:
    - name: https
      port: 18080
      targetPort: https
      protocol: TCP
