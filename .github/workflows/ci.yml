name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files and workflow policy
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check release metadata consistency
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1
      - name: Generate digest-pinned staging bundle
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw ./edge/package.json | ConvertFrom-Json
          ./scripts/new-staging-overlay.ps1 `
            -Version $metadata.version `
            -ControlPlaneDigest ('sha256:' + ('1' * 64)) `
            -EdgeDigest ('sha256:' + ('2' * 64))
      - name: Test production promotion planning contract
        shell: pwsh
        run: ./scripts/test-production-promotion-contract.ps1
      - name: Test initial production installation contract
        shell: pwsh
        run: ./scripts/test-initial-production-contract.ps1
      - name: Test production baseline and traffic contract
        shell: pwsh
        run: ./scripts/test-production-traffic-contract.ps1
      - name: Test production canary and expansion contract
        shell: pwsh
        run: ./scripts/test-production-expansion-contract.ps1
      - name: Test production progressive expansion contract
        shell: pwsh
        run: ./scripts/test-production-progressive-contract.ps1
      - name: Test production second expansion contract
        shell: pwsh
        run: ./scripts/test-production-second-expansion-contract.ps1
      - name: Test production final expansion contract
        shell: pwsh
        run: ./scripts/test-production-final-expansion-contract.ps1
      - name: Test production steady-state acceptance contract
        shell: pwsh
        run: ./scripts/test-production-steady-state-contract.ps1
      - name: Test continuous production assurance contract
        shell: pwsh
        run: ./scripts/test-production-assurance-contract.ps1
      - name: Test production incident response planning contract
        shell: pwsh
        run: ./scripts/test-production-incident-response-contract.ps1
      - name: Test production incident containment evidence contract
        shell: pwsh
        run: ./scripts/test-production-incident-containment-contract.ps1
      - name: Test production incident recovery planning contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-contract.ps1
      - name: Test production incident recovery execution evidence contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-evidence-contract.ps1
      - name: Test production recovery canary observation and expansion contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-expansion-contract.ps1
      - name: Test production recovery expansion execution evidence contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-expansion-evidence-contract.ps1
      - name: Test production recovery progressive observation and expansion contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-progressive-contract.ps1
      - name: Test production recovery progressive expansion execution evidence contract
        shell: pwsh
        run: ./scripts/test-production-incident-recovery-progressive-evidence-contract.ps1

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Go tests
        run: go test -count=1 ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Run the Go race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  edge:
    name: Edge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install Edge dependencies
        run: npm --prefix edge ci
      - name: Run Edge tests
        run: npm --prefix edge test
      - name: Type-check Edge
        run: npm --prefix edge run typecheck
      - name: Build Edge
        run: npm --prefix edge run build

  release-candidate:
    name: Release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Resolve and check release version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw ./edge/package.json | ConvertFrom-Json
          ./scripts/check-release-readiness.ps1 -Version $metadata.version
          "value=$($metadata.version)" >> $env:GITHUB_OUTPUT
      - name: Install and build Edge
        run: |
          npm --prefix edge ci
          npm --prefix edge run build
      - name: Build candidate release archives
        run: bash ./scripts/build-release-assets.sh '${{ steps.version.outputs.value }}' dist
      - name: Generate candidate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/shieldward-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate candidate checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - name: Verify candidate release bundle
        shell: pwsh
        run: ./scripts/verify-release-assets.ps1 -Directory ./dist -Version '${{ steps.version.outputs.value }}'

  distributed-rate-limit:
    name: Distributed rate limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install Edge dependencies
        run: npm --prefix edge ci
      - name: Test cross-instance rate limiting
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm --prefix edge test -- redis-rate-limit.integration.test.ts
