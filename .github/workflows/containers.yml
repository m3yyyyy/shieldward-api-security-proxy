name: Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    name: Build and scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: control-plane
            dockerfile: deploy/docker/control-plane.Dockerfile
            expected-user: "65532:65532"
          - component: edge
            dockerfile: deploy/docker/edge.Dockerfile
            expected-user: "1000:1000"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build local image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: shieldward/${{ matrix.component }}:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          sbom: false
      - name: Verify non-root image user
        shell: bash
        run: |
          actual_user="$(docker image inspect --format '{{.Config.User}}' 'shieldward/${{ matrix.component }}:ci')"
          if [[ "$actual_user" != '${{ matrix.expected-user }}' ]]; then
            echo "Expected user ${{ matrix.expected-user }}, got $actual_user" >&2
            exit 1
          fi
      - name: Smoke-test control-plane image
        if: matrix.component == 'control-plane'
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true shieldward/control-plane:ci version
      - name: Smoke-test Edge image
        if: matrix.component == 'edge'
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --entrypoint node shieldward/edge:ci --version
      - name: Scan final image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: shieldward/${{ matrix.component }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  compose-smoke:
    name: TLS compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generate ephemeral test credentials
        shell: pwsh
        run: |
          go run ./cmd/shieldwardd keygen
          ./scripts/new-container-tls.ps1
      - name: Restrict mounted private keys to container users
        shell: bash
        run: |
          sudo chown 65532:65532 .shieldward/private.pem .shieldward/containers/control-plane-key.pem
          sudo chmod 0400 .shieldward/private.pem .shieldward/containers/control-plane-key.pem
          sudo chown 1000:1000 .shieldward/containers/edge-key.pem .shieldward/containers/edge-client-key.pem
          sudo chmod 0400 .shieldward/containers/edge-key.pem .shieldward/containers/edge-client-key.pem
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start hardened stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Run production acceptance and outage drill
        shell: pwsh
        run: ./scripts/test-production-acceptance.ps1 -IncludeFailureDrills
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop hardened stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish (${{ matrix.component }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - image
      - compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - control-plane
          - edge
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.0.0." >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check release metadata and tag
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1 -Version '${{ steps.version.outputs.value }}' -RequireClean -RequireTag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Attest container image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
