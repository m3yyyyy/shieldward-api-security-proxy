version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /edge
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      edge-packages:
        patterns:
          - "*"
